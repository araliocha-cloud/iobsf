# The admin writes one file per post under content/.
# Korean originals of the essays are translated with Gemini (when the secret GEMINI_API_KEY is set),
# then everything is put together into the data files the site reads, and GitHub Pages is asked to publish.
name: Build content
on:
  push:
    branches: [main]
    paths: ["content/**", "tools/build_content.py"]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"   # once a day (03:17 in Korea): finishes any translation the free tier left for later
permissions:
  contents: write
  pages: write
concurrency:
  group: build-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/translate.py .
      - run: python3 tools/build_content.py .
      - name: Commit data
        run: |
          git add -A content data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "IOBSF admin"
          git config user.email "admin@iobsf.org"
          git commit -m "Translate and build data from content"
          git pull --rebase origin main
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
