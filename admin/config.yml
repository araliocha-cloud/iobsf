# IOBSF 관리 화면 설정 (Sveltia CMS)
# 글 한 편이 파일 한 개다 (content/ 아래 폴더). 저장하면 GitHub 저장소 main 브랜치에 기록되고,
# GitHub Actions가 tools/build_content.py로 사이트가 읽는 data/*.json을 다시 묶는다. 1~2분 뒤 홈페이지에 나타난다.
backend:
  name: github
  repo: araliocha-cloud/iobsf
  branch: main
  commit_messages:
    create: Create {{collection}} {{slug}} from admin
    update: Update {{collection}} {{slug}} from admin
    delete: Delete {{collection}} {{slug}} from admin
site_url: https://iobsf.org/
display_url: https://iobsf.org/
logo_url: https://iobsf.org/assets/img/emblem-small.png
media_folder: assets/img/uploads
public_folder: assets/img/uploads
collections:
- name: writings
  label: 서고 글 (Writings)
  label_singular: 글
  description: 서고(Archives)에 실리는 글. 「새 글」을 누르면 빈 글 한 편이 열린다. 한국어 원고만 쓰고 저장하면 영어, 일본어, 중국어 본문이 자동으로 채워진다.
  folder: content/writings
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
  summary: '{{title.ko}}'
  sortable_fields:
    fields:
    - slug
    default:
      field: slug
      direction: descending
  fields:
  - name: category
    label: 분류 (서사 기록 칸)
    widget: select
    options:
    - label: 인류바비큐문명사 (Civilization History)
      value: civilization
    - label: 바비큐 인문학 (Barbecue Humanities)
      value: humanities
    - label: 각국 바비큐의 역사 서사 (Histories of the Nations' Fires)
      value: narratives
    - label: 인간과 사회 (The Human and Society)
      value: society
  - name: title
    label: 제목
    widget: object
    fields:
    - name: ko
      label: 한국어 제목
      widget: string
    - name: en
      label: 영어 제목 (비워 두면 자동 번역)
      widget: string
      required: false
    - name: ja
      label: 일본어 제목 (비워 두면 자동 번역)
      widget: string
      required: false
    - name: zh
      label: 중국어 제목 (비워 두면 자동 번역)
      widget: string
      required: false
  - name: subtitle
    label: 부제
    widget: object
    required: false
    fields:
    - name: ko
      label: 한국어 부제
      widget: string
      required: false
    - name: en
      label: 영어 부제 (비워 두면 자동 번역)
      widget: string
      required: false
    - name: ja
      label: 일본어 부제 (비워 두면 자동 번역)
      widget: string
      required: false
    - name: zh
      label: 중국어 부제 (비워 두면 자동 번역)
      widget: string
      required: false
  - name: id
    label: 주소 이름 (영문 소문자와 하이픈, 비워 두면 영어 제목으로 자동 생성)
    widget: string
    required: false
  - name: image
    label: 대표 이미지
    widget: image
    required: false
  - name: image_caption
    label: 이미지 설명 (출처 등, 선택)
    widget: string
    required: false
  - name: body
    label: 본문 (한국어 원문)
    widget: markdown
    hint: '문단은 빈 줄로 나눈다. 소제목은 맨 앞에 ### 를, 인용은 > 를 붙인다.'
  - name: body_en
    label: 영어 본문 (자동 번역, 손으로 고칠 수 있다)
    widget: markdown
    required: false
  - name: body_ja
    label: 일본어 본문 (자동 번역, 손으로 고칠 수 있다)
    widget: markdown
    required: false
  - name: body_zh
    label: 중국어 본문 (자동 번역, 손으로 고칠 수 있다)
    widget: markdown
    required: false
  - name: refs
    label: 참고문헌
    widget: list
    required: false
    field:
      name: ref
      label: 문헌
      widget: string
  - name: published
    label: 처음 실린 곳 (선택)
    widget: object
    required: false
    collapsed: true
    fields:
    - name: outlet
      label: '매체 이름 (예: Korea Post)'
      widget: string
      required: false
    - name: date
      label: 날짜 (YYYY-MM-DD)
      widget: string
      required: false
    - name: href
      label: 원문 주소
      widget: string
      required: false
  - name: by
    label: 필자
    widget: object
    required: false
    collapsed: true
    fields:
    - name: en
      label: 영어
      widget: string
      default: Shaka Chaa
      required: false
    - name: ko
      label: 한국어
      widget: string
      default: 차영기
      required: false
